version: '3.8'

services:
  # A3M Router Server
  a3m-router:
    image: ghcr.io/das-rebel/a3m-router:latest
    container_name: a3m-router
    ports:
      - "8787:8787"
    environment:
      # Provider API Keys (add your keys here)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      
      # Server Configuration
      - A3M_PORT=8787
      - A3M_LOG_LEVEL=info
      
      # Budget Controls
      - A3M_BUDGET_MONTHLY=${A3M_BUDGET_MONTHLY:-}
      
      # Cache Configuration
      - A3M_CACHE_TTL=3600
      
    volumes:
      # Optional: Mount custom config
      - ./a3m-config.json:/app/config.json:ro
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    networks:
      - a3m-network

  # Optional: Redis for distributed cache
  redis:
    image: redis:7-alpine
    container_name: a3m-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - a3m-network
    profiles:
      - with-redis

  # Optional: Grafana dashboard for metrics
  grafana:
    image: grafana/grafana:latest
    container_name: a3m-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - a3m-network
    profiles:
      - with-monitoring

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: a3m-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - a3m-network
    profiles:
      - with-monitoring

networks:
  a3m-network:
    driver: bridge

volumes:
  redis-data:
  grafana-data:
  prometheus-data:
