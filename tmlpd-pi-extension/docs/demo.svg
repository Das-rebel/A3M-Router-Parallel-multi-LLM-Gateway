<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="Menlo, Monaco, 'Courier New', monospace">
  <!-- terminal window -->
  <rect x="0" y="0" width="880" height="440" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="880" height="44" rx="12" fill="#161b22"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="440" y="27" fill="#8b949e" font-size="13" text-anchor="middle">tmlpd-pi — parallel ensemble</text>

  <!-- prompt -->
  <text x="24" y="78" fill="#79c0ff" font-size="14">$ <tspan fill="#c9d1d9">npm install tmlpd-pi</tspan></text>
  <text x="24" y="102" fill="#8b949e" font-size="13">added 1 package in 1.2s</text>

  <text x="24" y="136" fill="#79c0ff" font-size="14">$ <tspan fill="#c9d1d9">node demo.mjs</tspan></text>

  <!-- racing providers -->
  <text x="24" y="170" fill="#c9d1d9" font-size="14">Query: "Explain vector databases"</text>
  <text x="24" y="194" fill="#c9d1d9" font-size="14">Racing 3 providers in parallel...</text>

  <!-- provider bars -->
  <text x="40" y="226" fill="#3fb950" font-size="14">groq      ████████████████  820ms   score 0.91  ★ WINNER</text>
  <text x="40" y="250" fill="#d29922" font-size="14">openai    ██████████████    1240ms  score 0.88</text>
  <text x="40" y="274" fill="#d29922" font-size="14">nvidia    ███████████       1610ms  score 0.84</text>

  <!-- result -->
  <text x="24" y="312" fill="#c9d1d9" font-size="14">Wall-clock: 1.61s  (sequential would be 3.67s)</text>
  <text x="24" y="336" fill="#c9d1d9" font-size="14">Cost: $0.00082  (groq $0.00021 · openai $0.00045 · nvidia $0.00016)</text>

  <text x="24" y="372" fill="#8b949e" font-size="13">reasoning: groq answer more specific (mentions HNSW, IVF),</text>
  <text x="24" y="392" fill="#8b949e" font-size="13">best structure, directly addresses query intent</text>

  <text x="24" y="420" fill="#79c0ff" font-size="14">$ <tspan fill="#3fb950">✔ kept best of 3 answers for the price of the slowest</tspan></text>
</svg>
